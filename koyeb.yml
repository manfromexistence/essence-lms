app:
  name: dhaka-it-institute

services:
  - name: web
    type: web
    port: 80
    dockerfile: Dockerfile
    env:
      - APP_NAME=Dhaka IT Institute
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
