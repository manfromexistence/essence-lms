# ===========================================================================
# REFERENCE ONLY — this file is NOT applied to the live service.
#
# The service srv-d9l05lfavr4c739q5nig was created directly in the Render
# dashboard, not from this blueprint, so Render does not read these values.
# Verified drift (see README.md → "render.yaml is reference, not the source of
# truth"):
#
#   * healthCheckPath is "" on the live service, not /up.
#   * BREVO_API_KEY / BREVO_SENDER_EMAIL / BREVO_SENDER_NAME are absent from the
#     live service, which is why config/mail.php had to carry a hardcoded
#     fallback key.
#
# Treat the dashboard as the source of truth, or delete this file.
# ===========================================================================
services:
  - type: web
    name: dhaka-it-institute
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://dhaka-it-institute.onrender.com
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: "Dhaka IT Institute"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      # =========================================================================
      # DATA LOSS: no persistent disk is attached to this service
      # (GET /v1/disks returns []). The SQLite file lives inside the container,
      # so every deploy starts from an empty filesystem and the entrypoint
      # re-seeds from scratch. Student and admission data does not survive a
      # deploy.
      #
      # Fix before real admissions — either:
      #   1. attach a disk at /var/www/html/database (>= 1 GB), or
      #   2. move to managed PostgreSQL (DB_CONNECTION=pgsql + DB_* values).
      #
      # One-shot reset: temporarily add FORCE_RESEED=true to rebuild this SQLite
      # database from the seeders on the next deploy (remove it afterwards).
      # =========================================================================
      - key: FORCE_RESEED
        value: "false"
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log
      # Media (images, course video, exam screenshots, payment proofs, exports)
      # is hosted on Catbox rather than on this container's filesystem, which is
      # what makes large lecture video practical and keeps uploads across
      # deploys. Two caveats: objects are world-readable and permanent, and they
      # cannot be deleted without CATBOX_USERHASH.
      - key: FILESYSTEM_DISK
        value: catbox
      - key: PRIVATE_FILESYSTEM_DISK
        value: catbox
      - key: CATBOX_API_URL
        value: https://catbox.moe/user/api.php
      - key: CATBOX_BASE_URL
        value: https://files.catbox.moe
      - key: CATBOX_USERHASH
        sync: false
      # Catbox's own ceiling is 200 MB. Validating against anything larger only
      # moves the failure to after the whole transfer.
      - key: MEDIA_MAX_UPLOAD_KB
        value: "204800"
      # Transactional email goes through Brevo's HTTP API, not Laravel Mail, so
      # MAIL_MAILER above does not affect it. Set these in the dashboard.
      #
      # config/mail.php no longer carries a fallback key: the literal committed
      # in ca58f33 is in every clone and must be treated as compromised. Until
      # these are set, every send is recorded in email_logs as failed with
      # "Brevo API key / sender email is not configured in Settings."
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Dhaka IT Institute"
      # Trust Render's reverse proxy so Laravel generates https:// URLs for
      # assets and redirects (otherwise @vite emits http:// links that the
      # browser blocks as mixed content and the dashboard renders unstyled).
      - key: TRUSTED_PROXIES
        value: "*"
