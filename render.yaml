services:
  - type: web
    name: dhaka-it-institute
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://dhaka-it-institute.onrender.com
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: "Dhaka IT Institute"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      # WARNING: free-plan ephemeral filesystem — attach a paid persistent disk
      # at /var/www/html/database AND /var/www/html/storage, or switch
      # DB_CONNECTION/DB_URL to managed PostgreSQL before real admissions.
      #
      # One-shot reset: temporarily add FORCE_RESEED=true to rebuild this SQLite
      # database from the seeders on the next deploy (remember to remove it
      # afterwards so later boots do not wipe data).
      - key: FORCE_RESEED
        value: "false"
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log
      # Transactional email is sent through Brevo's HTTP API (not Laravel Mail),
      # so MAIL_MAILER above does not affect it. The API key is deliberately NOT
      # stored here: `sync: false` keeps it out of git and requires it to be set
      # in the Render dashboard (Environment tab). The DB `settings` table is
      # wiped on every deploy, so an env var is the only durable source.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: ajju40959@gmail.com
      - key: BREVO_SENDER_NAME
        value: "Dhaka IT Institute"
      # Trust Render's reverse proxy so Laravel generates https:// URLs for
      # assets and redirects (otherwise @vite emits http:// links that the
      # browser blocks as mixed content and the dashboard renders unstyled).
      - key: TRUSTED_PROXIES
        value: "*"
