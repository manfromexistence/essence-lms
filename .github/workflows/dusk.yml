name: Browser Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dusk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Copy environment and generate app key
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate

      - name: Install ChromeDriver matching preinstalled Chrome
        run: php artisan dusk:chrome-driver --detect

      - name: Run Dusk browser suite (headless)
        run: composer test:dusk
        env:
          DUSK_HEADLESS_DISABLED: false

      - name: Upload failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failures
          path: |
            tests/Browser/screenshots
            storage/logs
          if-no-files-found: ignore
