; PHP configuration for this directory
; Read by PHP-FPM (Apache/cPanel). Nginx deployments — including the Render
; service — ignore this file and use platform-level settings instead, so these
; values are a floor for shared hosting, not a guarantee in production.

; upload_tmp_dir was pinned to "C:\Users\Computer\AppData\Local\Temp", a
; developer machine path committed by accident. On Linux it resolves to nothing
; and PHP silently falls back to its own temp directory; on a Windows host it
; would place every upload — payment proofs, exam screenshots, ID documents —
; in one shared per-user directory. Omitted so PHP chooses a safe per-SAPI path.

; These must stay in step with config/media.php max_upload_kb, which defaults to
; 200 MB. They previously read 30M/32M while the application validated uploads
; against 200 MB, so the allowance was unreachable: PHP discards an oversized
; body before the script runs, hasFile() returns false, and the user is told the
; field is required rather than that the file is too large. Raise the app's cap
; and these must move together.
upload_max_filesize = 200M
post_max_size = 210M

; Slightly above a 200 MB upload so the parser has room for multipart
; boundaries and headers without truncating the final part.
memory_limit = 512M
max_execution_time = 300
